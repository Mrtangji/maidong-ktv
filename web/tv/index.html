<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>麦动KTV · 电视端</title>
<style>
  :root {
    --bg: #101319; --panel: #1a1f2a; --panel2: #232a38; --line: #2e3648;
    --text: #eef1f6; --dim: #8b93a7; --accent: #ff5c7a; --accent2: #4f8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--line);
  }
  .logo { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  .tabs { display: flex; gap: 8px; margin-left: 12px; }
  .tab {
    padding: 8px 22px; border-radius: 22px; font-size: 20px;
    color: var(--dim); background: var(--panel); border: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: #fff; background: var(--panel2); border-color: var(--accent); }
  #status { margin-left: auto; font-size: 16px; color: var(--dim); }
  #status.ok { color: #62d68f; }
  #status.bad { color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }
  #content { flex: 1; overflow-y: auto; padding: 20px 28px; }
  #side {
    width: 340px; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #side h3 { padding: 14px 18px; font-size: 19px; border-bottom: 1px solid var(--line); }
  #queue { flex: 1; overflow-y: auto; }

  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 12px; margin: 6px 12px;
    border: 2px solid transparent; cursor: pointer;
  }
  .item:focus, .item.focused { border-color: var(--accent2); background: var(--panel2); outline: none; }
  .item .num { width: 30px; color: var(--dim); font-size: 18px; text-align: center; }
  .item .thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--panel2); }
  .item .meta { flex: 1; min-width: 0; }
  .item .t { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 15px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 12px; color: #62d68f; border: 1px solid #62d68f; border-radius: 6px; padding: 1px 6px; }
  .board-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .board-card {
    width: 200px; padding: 22px 18px; background: var(--panel); border-radius: 14px;
    font-size: 21px; border: 2px solid transparent; cursor: pointer;
  }
  .board-card:focus { border-color: var(--accent2); background: var(--panel2); outline: none; }
  .board-card small { display: block; color: var(--dim); font-size: 14px; margin-top: 6px; }

  /* 播放条 */
  #player {
    border-top: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: stretch; height: 172px;
  }
  #npInfo { width: 360px; padding: 16px 24px; display: flex; flex-direction: column; justify-content: center; }
  #npTitle { font-size: 24px; font-weight: 700; }
  #npSinger { font-size: 17px; color: var(--dim); margin-top: 4px; }
  #npState { font-size: 14px; margin-top: 8px; color: var(--accent2); }
  #lyrics { flex: 1; overflow: hidden; position: relative; }
  #lyricInner { position: absolute; width: 100%; transition: transform .35s; padding: 8px 24px; }
  .lrc-line { font-size: 20px; color: var(--dim); line-height: 1.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrc-line.active { color: var(--accent); font-size: 23px; font-weight: 700; }
  #npCtl {
    width: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
    border-left: 1px solid var(--line);
  }
  .ctl-btn {
    width: 160px; padding: 10px 0; text-align: center; font-size: 19px;
    background: var(--panel2); border-radius: 12px; border: 2px solid transparent; cursor: pointer;
  }
  .ctl-btn:focus { border-color: var(--accent2); outline: none; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; font-size: 19px; }
  #searchBoxWrap { display: none; }
  #searchBoxWrap.show { display: block; margin-bottom: 16px; }
  #searchBox {
    width: 100%; padding: 14px 20px; font-size: 22px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel2); color: var(--text); outline: none;
  }
  #searchBox:focus { border-color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="logo">麦动KTV</div>
  <div class="tabs">
    <div class="tab active" data-tab="board">榜单</div>
    <div class="tab" data-tab="search">搜索</div>
    <div class="tab" data-tab="library">曲库</div>
  </div>
  <div id="status">连接中…</div>
</header>

<main>
  <div id="content">
    <div id="searchBoxWrap">
      <input id="searchBox" placeholder="输入歌名 / 歌手，按 OK 键搜索">
    </div>
    <div id="list"></div>
  </div>
  <div id="side">
    <h3>已点歌曲 <span id="queueCount" style="color:var(--dim);font-size:15px"></span></h3>
    <div id="queue"></div>
  </div>
</main>

<div id="player">
  <div id="npInfo">
    <div id="npTitle">未在播放</div>
    <div id="npSinger">电视遥控 OK 键选择歌曲 · 手机访问 /m 点歌</div>
    <div id="npState"></div>
  </div>
  <div id="lyrics"><div id="lyricInner"></div></div>
  <div id="npCtl">
    <div class="ctl-btn" id="btnPlay" tabindex="0">⏯ 暂停/继续</div>
    <div class="ctl-btn" id="btnNext" tabindex="0">⏭ 切下一首</div>
  </div>
</div>

<audio id="audio"></audio>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch(p, opt).then(async (r) => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
});

let tab = 'board';
let currentSong = null;
let lyricLines = [];
let boardCache = {};

// ---------- 状态 ----------
async function refreshStatus() {
  try {
    const h = await api('/api/v1/health');
    const s = $('#status');
    if (h.ready) { s.textContent = '音源已就绪'; s.className = 'ok'; }
    else { s.textContent = '未导入音源脚本（手机端 /m 导入）'; s.className = 'bad'; }
  } catch (_) {
    $('#status').textContent = '服务不可达'; $('#status').className = 'bad';
  }
}

// ---------- 渲染 ----------
function songItem(s, i, actions) {
  const div = document.createElement('div');
  div.className = 'item';
  div.tabIndex = 0;
  const cached = s.cached ? ' <span class="badge">已缓存</span>' : '';
  div.innerHTML = `<div class="num">${i + 1}</div>` +
    (s.pic ? `<img class="thumb" src="${s.pic}" onerror="this.style.visibility='hidden'">` : '') +
    `<div class="meta"><div class="t">${esc(s.title)} ${cached}</div><div class="s">${esc(s.singer || '')}</div></div>`;
  div.addEventListener('click', () => actions(s));
  return div;
}

function esc(v) {
  return String(v || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function showBoards() {
  const list = $('#list');
  list.innerHTML = '<div class="empty">加载榜单中…</div>';
  try {
    const { boards } = await api('/api/v1/board');
    list.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'board-grid';
    boards.forEach((b) => {
      const card = document.createElement('div');
      card.className = 'board-card';
      card.tabIndex = 0;
      card.innerHTML = `${esc(b.name)}<small>酷我榜单</small>`;
      card.addEventListener('click', () => showBoardSongs(b));
      grid.appendChild(card);
    });
    list.appendChild(grid);
  } catch (e) { list.innerHTML = `<div class="empty">榜单加载失败：${esc(e.message)}</div>`; }
}

async function showBoardSongs(b) {
  const list = $('#list');
  list.innerHTML = `<div class="empty">加载「${esc(b.name)}」…</div>`;
  try {
    if (!boardCache[b.id]) boardCache[b.id] = (await api(`/api/v1/board/songs?id=${encodeURIComponent(b.id)}`)).songs;
    renderSongs(boardCache[b.id]);
  } catch (e) { list.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; }
}

function renderSongs(songs) {
  const list = $('#list');
  list.innerHTML = '';
  if (!songs.length) { list.innerHTML = '<div class="empty">没有结果</div>'; return; }
  songs.forEach((s, i) => list.appendChild(songItem(s, i, orderSong)));
}

async function doSearch() {
  const kw = $('#searchBox').value.trim();
  if (!kw) return;
  const list = $('#list');
  list.innerHTML = '<div class="empty">搜索中…</div>';
  try {
    const { songs } = await api(`/api/v1/search?keyword=${encodeURIComponent(kw)}&limit=30`);
    renderSongs(songs);
  } catch (e) { list.innerHTML = `<div class="empty">搜索失败：${esc(e.message)}</div>`; }
}

// ---------- 点歌 / 播放 ----------
async function orderSong(s) {
  try {
    await api('/api/v1/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ songId: s.songId, title: s.title, singer: s.singer, album: s.album, pic: s.pic, musicInfo: s.musicInfo }),
    });
    refreshQueue();
    if (!currentSong) playNext();
  } catch (e) { alert('点歌失败：' + e.message); }
}

async function playNext() {
  const { items } = await api('/api/v1/queue');
  if (!items.length) { stopPlayback('队列为空，等待点歌…'); return; }
  const song = items[0];
  currentSong = song;
  $('#npTitle').textContent = song.title;
  $('#npSinger').textContent = song.singer || '';
  $('#npState').textContent = '播放中';
  const audio = $('#audio');
  audio.src = `/stream?songId=${encodeURIComponent(song.songId)}&title=${encodeURIComponent(song.title || '')}&singer=${encodeURIComponent(song.singer || '')}&quality=128k`;
  audio.play().catch(() => {});
  loadLyric(song.songId);
  refreshQueue();
}

function stopPlayback(msg) {
  currentSong = null;
  $('#audio').pause();
  $('#npTitle').textContent = '未在播放';
  $('#npSinger').textContent = msg || '';
  $('#npState').textContent = '';
  $('#lyricInner').innerHTML = '';
}

async function songEnded() {
  if (currentSong) { try { await api('/api/v1/queue/played'); } catch (_) {} }
  playNext();
}

async function refreshQueue() {
  try {
    const { items } = await api('/api/v1/queue');
    $('#queueCount').textContent = items.length ? `${items.length} 首` : '';
    const q = $('#queue');
    q.innerHTML = '';
    if (!items.length) { q.innerHTML = '<div class="empty">还没有人点歌</div>'; return; }
    items.forEach((s, i) => {
      const div = songItem(s, i, async () => {
        if (confirm(`跳过「${s.title}」？`)) {
          if (i === 0) { await api('/api/v1/queue/played'); playNext(); }
          else { await api(`/api/v1/queue/${i}`, { method: 'DELETE' }); refreshQueue(); }
        }
      });
      if (i === 0) div.querySelector('.t').innerHTML += ' <span style="color:var(--accent)">▶</span>';
      q.appendChild(div);
    });
  } catch (_) { /* ignore */ }
}

async function showLibrary() {
  const list = $('#list');
  list.innerHTML = '<div class="empty">加载曲库中…</div>';
  try {
    const { songs, status } = await api('/api/v1/library');
    list.innerHTML = `<div style="color:var(--dim);font-size:16px;margin-bottom:10px">NAS 曲库共 ${songs.length} 首 · 缓存中 ${status.pending} 首</div>`;
    if (!songs.length) { list.innerHTML += '<div class="empty">还没有缓存歌曲，播放过的歌会自动缓存到 NAS</div>'; return; }
    songs.forEach((s, i) => {
      const div = songItem({ songId: s.songId, title: s.title, singer: s.singer, cached: true, pic: s.pic }, i, async (song) => {
        currentSong = song;
        $('#npTitle').textContent = song.title;
        $('#npSinger').textContent = song.singer || '';
        $('#npState').textContent = '播放中（本地曲库）';
        const audio = $('#audio');
        audio.src = `/music/${encodeURIComponent(s.file)}`;
        audio.play().catch(() => {});
        loadLyric(song.songId);
      });
      list.appendChild(div);
    });
  } catch (e) { list.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; }
}

// ---------- 歌词 ----------
async function loadLyric(songId) {
  lyricLines = [];
  $('#lyricInner').innerHTML = '';
  try {
    const { lyric } = await api(`/api/v1/lyric?songId=${encodeURIComponent(songId)}`);
    lyricLines = lyric.split(/\r?\n/).map((line) => {
      const m = line.match(/^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)$/);
      return m ? { t: (+m[1]) * 60 + (+m[2]) + (+((m[3] || '0').padEnd(3, '0')) / 1000), text: m[4].trim() } : null;
    }).filter(Boolean);
    $('#lyricInner').innerHTML = lyricLines.map((l, i) => `<div class="lrc-line" data-i="${i}">${esc(l.text || ' ')}</div>`).join('');
  } catch (_) { /* 无歌词忽略 */ }
}

$('#audio').addEventListener('timeupdate', () => {
  if (!lyricLines.length) return;
  const cur = $('#audio').currentTime + 0.2;
  let idx = -1;
  for (let i = 0; i < lyricLines.length; i++) if (lyricLines[i].t <= cur) idx = i;
  const inner = $('#lyricInner');
  inner.querySelectorAll('.lrc-line').forEach((el) => el.classList.remove('active'));
  const el = inner.querySelector(`.lrc-line[data-i="${idx}"]`);
  if (el) {
    el.classList.add('active');
    const offset = el.offsetTop - $('#lyrics').clientHeight / 2 + el.clientHeight / 2;
    inner.style.transform = `translateY(${-Math.max(offset, 0)}px)`;
  }
});
$('#audio').addEventListener('ended', songEnded);

// ---------- 遥控键 ----------
$('#btnPlay').addEventListener('click', () => {
  const a = $('#audio');
  if (!a.src) { playNext(); return; }
  if (a.paused) a.play(); else a.pause();
  $('#npState').textContent = a.paused ? '已暂停' : '播放中';
});
$('#btnNext').addEventListener('click', songEnded);

document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

function switchTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
  $('#searchBoxWrap').classList.toggle('show', name === 'search');
  if (name === 'board') showBoards();
  if (name === 'search') { $('#searchBox').focus(); }
  if (name === 'library') showLibrary();
}

$('#searchBox').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && $('#searchBox').value.trim()) { doSearch(); $('#searchBox').blur(); }
});

// 遥控器方向键在焦点元素间导航
document.addEventListener('keydown', (e) => {
  const focusable = [...document.querySelectorAll('.item, .board-card, .ctl-btn, .tab, #searchBox')].filter((el) => el.offsetParent !== null);
  const idx = focusable.indexOf(document.activeElement);
  const cols = 4;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!focusable.length) return;
    let next;
    if (e.key === 'ArrowDown') next = Math.min(idx + cols, focusable.length - 1);
    else if (e.key === 'ArrowUp') next = Math.max(idx - cols, 0);
    else if (e.key === 'ArrowRight') next = idx < 0 ? 0 : Math.min(idx + 1, focusable.length - 1);
    else next = idx < 0 ? 0 : Math.max(idx - 1, 0);
    focusable[next === -1 ? 0 : next].focus();
  } else if (e.key === 'Enter' && document.activeElement && document.activeElement.click) {
    if (document.activeElement.id !== 'searchBox') { e.preventDefault(); document.activeElement.click(); }
  }
});

// ---------- 启动 ----------
refreshStatus();
setInterval(refreshStatus, 15000);
refreshQueue();
setInterval(refreshQueue, 5000);
showBoards();
</script>
</body>
</html>
